services:

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres-compose

    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  backend:
    build:
      context: ./backend

    container_name: ecommerce-backend-compose

    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_pass
      DB_NAME: ecommerce_db

    ports:
      - "5000:5000"

    depends_on:
      - postgres


  frontend:
    build:
      context: ./frontend

    container_name: ecommerce-frontend-compose

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  postgres_data:
